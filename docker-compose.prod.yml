services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: parlai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: parlai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parlai -d parlai"]
      interval: 5s
      timeout: 3s
      retries: 20
    # no published ports: only other containers can reach it

  migrate:
    image: ${PARLAI_IMAGE:-parl-ai:local}
    command: ["node", "dist/migrate.js"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://parlai:${POSTGRES_PASSWORD}@db:5432/parlai
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${PARLAI_IMAGE:-parl-ai:local}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://parlai:${POSTGRES_PASSWORD}@db:5432/parlai
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    profiles: ["proxy"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN}"
    volumes:
      - "./docker/Caddyfile:/etc/caddy/Caddyfile:ro"
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}