name: Docker Smoke Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t parl-ai:local .
      - name: Start stack
        run: |
          cp ci/.env.ci .env.production
          docker compose --env-file ci/.env.ci -f docker-compose.prod.yml -f ci/docker-compose.ci.yml up -d --wait --wait-timeout 180
      - name: Health check
        run: curl --fail --retry 10 --retry-delay 3 http://localhost:3000/api/health
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file ci/.env.ci -f docker-compose.prod.yml -f ci/docker-compose.ci.yml logs
      - name: Tear down
        if: always()
        run: docker compose --env-file ci/.env.ci -f docker-compose.prod.yml -f ci/docker-compose.ci.yml down -v